<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chunked Upload Example - Pass97</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    input[type="file"] { margin: 1rem 0; }
    .progress { height: 24px; background: #eee; border-radius: 4px; overflow: hidden; margin: 0.5rem 0; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, #0ea5e9, #06b6d4); transition: width 0.2s; }
    .status { font-family: monospace; font-size: 0.85rem; background: #f5f5f5; padding: 0.75rem; border-radius: 4px; white-space: pre-wrap; word-break: break-all; }
    .result { margin-top: 1rem; padding: 1rem; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 4px; }
    .error { background: #fef2f2; border-color: #fecaca; }
    button { padding: 0.5rem 1rem; cursor: pointer; background: #0ea5e9; color: white; border: none; border-radius: 4px; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .config { display: grid; grid-template-columns: auto 1fr; gap: 0.5rem; align-items: center; margin: 1rem 0; }
    .config label { font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Chunked Upload Example</h1>
  <p>Upload large audit artifacts (3–10 GB) using parallel chunked uploads. Resumable on connection loss.</p>

  <div class="config">
    <label for="baseUrl">API Base URL:</label>
    <input id="baseUrl" type="text" value="http://localhost:8000/api" style="padding: 0.5rem;">
    <label for="concurrency">Parallel uploads:</label>
    <input id="concurrency" type="number" min="1" max="16" value="8" style="padding: 0.5rem; width: 80px;">
    <label for="chunkSize">Chunk size (MB):</label>
    <input id="chunkSize" type="number" min="5" max="50" value="10" style="padding: 0.5rem; width: 80px;">
    <label for="resumeId">Resume Upload ID:</label>
    <input id="resumeId" type="text" placeholder="(optional - paste to resume)" style="padding: 0.5rem;">
  </div>

  <input type="file" id="fileInput" accept=".lm3z,.rim0,.rim95">
  <button id="uploadBtn" disabled>Upload</button>

  <div class="progress" style="display:none;" id="progressContainer">
    <div class="progress-bar" id="progressBar" style="width: 0%"></div>
  </div>
  <p id="progressText"></p>

  <div class="status" id="status"></div>
  <div class="result" id="result" style="display:none;"></div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');

    fileInput.addEventListener('change', () => {
      uploadBtn.disabled = !fileInput.files?.length;
    });

    uploadBtn.addEventListener('click', async () => {
      const file = fileInput.files?.[0];
      if (!file) return;

      const baseUrl = document.getElementById('baseUrl').value.replace(/\/$/, '');
      const concurrency = parseInt(document.getElementById('concurrency').value, 10) || 8;
      const chunkSizeMb = parseInt(document.getElementById('chunkSize').value, 10) || 10;
      const chunkSize = chunkSizeMb * 1024 * 1024;

      const totalChunks = Math.ceil(file.size / chunkSize);
      if (totalChunks > 2000) {
        alert('Too many chunks. Increase chunk size.');
        return;
      }

      uploadBtn.disabled = true;
      progressContainer.style.display = 'block';
      resultEl.style.display = 'none';
      statusEl.textContent = 'Initiating upload...';

      try {
        let upload_id, existing, totalChunks, chunkSize;
        const resumeId = document.getElementById('resumeId').value.trim();

        if (resumeId) {
          // Resume: get status first
          statusEl.textContent = 'Resuming upload...';
          const statusRes = await fetch(`${baseUrl}/upload/chunked/${resumeId}/status`);
          if (!statusRes.ok) throw new Error('Session not found or expired. Start a new upload.');
          const status = await statusRes.json();
          if (status.status === 'completed') {
            resultEl.style.display = 'block';
            resultEl.className = 'result';
            resultEl.textContent = 'Upload already completed. Upload ID: ' + resumeId;
            statusEl.textContent = 'Done.';
            uploadBtn.disabled = false;
            return;
          }
          if (status.status === 'failed') throw new Error('Previous upload failed: ' + (status.error || 'unknown'));
          upload_id = status.upload_id;
          existing = status.uploaded_chunks || [];
          totalChunks = status.total_chunks;
          chunkSize = status.chunk_size || Math.ceil(status.total_size / totalChunks);
          if (Math.abs(file.size - status.total_size) > 0) throw new Error('File size does not match. Use the same file to resume.');
        } else {
          // New upload: init session
          totalChunks = Math.ceil(file.size / chunkSize);
          if (totalChunks > 2000) {
            alert('Too many chunks. Increase chunk size.');
            uploadBtn.disabled = false;
            return;
          }
          const initRes = await fetch(`${baseUrl}/upload/chunked/init`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              filename: file.name,
              total_size: file.size,
              total_chunks: totalChunks,
              chunk_size: chunkSize,
            }),
          });
          if (!initRes.ok) throw new Error(await initRes.text());
          const initData = await initRes.json();
          upload_id = initData.upload_id;
          existing = initData.uploaded_chunks || [];
        }

        const existingSet = new Set(existing);
        const missing = [];
        for (let i = 0; i < totalChunks; i++) if (!existingSet.has(i)) missing.push(i);

        if (missing.length === 0) {
          statusEl.textContent = `Session: ${upload_id}\nAll chunks uploaded. Completing...`;
        } else {
          statusEl.textContent = `Session: ${upload_id}\n(Save ID to resume)\nUploading ${missing.length} chunks (${existing.length} done)...`;
        }

        // 2. Upload chunks in parallel (with concurrency limit)
        const uploadChunk = async (index) => {
          const start = index * chunkSize;
          const end = Math.min(start + chunkSize, file.size);
          const blob = file.slice(start, end);
          const form = new FormData();
          form.append('file', blob, file.name);

          const res = await fetch(`${baseUrl}/upload/chunked/${upload_id}/chunk/${index}`, {
            method: 'PUT',
            body: form,
          });
          if (!res.ok) throw new Error(`Chunk ${index}: ${await res.text()}`);
        };

        // Process in batches of `concurrency` for true parallel uploads
        for (let b = 0; b < missing.length; b += concurrency) {
          const batch = missing.slice(b, b + concurrency);
          await Promise.all(batch.map(i => uploadChunk(i)));
          const done = existing.length + Math.min(b + batch.length, missing.length);
          const pct = (100 * done / totalChunks).toFixed(1);
          progressBar.style.width = pct + '%';
          progressText.textContent = `Uploaded ${done}/${totalChunks} chunks (${pct}%)`;
        }

        progressBar.style.width = '100%';
        progressText.textContent = 'Upload complete. Processing...';
        statusEl.textContent = 'Triggering merge and RIM audit...';

        // 3. Complete
        const completeRes = await fetch(`${baseUrl}/upload/chunked/${upload_id}/complete`, {
          method: 'POST',
        });
        if (!completeRes.ok) throw new Error(await completeRes.text());
        const result = await completeRes.json();

        resultEl.style.display = 'block';
        resultEl.className = 'result';
        resultEl.innerHTML = `
          <strong>Upload successful</strong><br>
          Upload ID: ${result.upload_id}<br>
          File: ${result.file_info?.name}<br>
          Hash: ${result.file_hash}<br>
          Status: ${result.verification?.status}<br>
          Audit Score: ${result.kpis?.find(k => k.label === 'Audit Score')?.value ?? 'N/A'}
        `;
        statusEl.textContent = 'Done.';
      } catch (err) {
        resultEl.style.display = 'block';
        resultEl.className = 'result error';
        resultEl.textContent = 'Error: ' + err.message;
        statusEl.textContent = 'Upload failed. You can retry; already-uploaded chunks will be skipped.';
      } finally {
        uploadBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
